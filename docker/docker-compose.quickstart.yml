# EmbRouter quickstart stack: the gateway plus a Postgres database that stores
# models, virtual keys, and spend logs. Used by
#
#   printf 'EMBROUTER_MASTER_KEY=sk-%s\nEMBROUTER_SALT_KEY=sk-%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
#   docker compose -f docker-compose.quickstart.yml up -d
#
# Compose reads .env from this directory. Keep it: regenerating EMBROUTER_SALT_KEY
# makes credentials already stored in the database unreadable. For anything
# beyond local evaluation, build and tag a specific release.
services:
  embrouter:
    build:
      context: ..
      args:
        target: runtime
    image: embrouter:local
    ports:
      - "4000:4000"
    environment:
      EMBROUTER_MASTER_KEY: ${EMBROUTER_MASTER_KEY:?set it in .env - see the header of this file}
      EMBROUTER_SALT_KEY: ${EMBROUTER_SALT_KEY:?set it in .env - see the header of this file}
      DATABASE_URL: postgresql://embrouter:embrouter@db:5432/embrouter
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: embrouter
      POSTGRES_PASSWORD: embrouter
      POSTGRES_DB: embrouter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embrouter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
